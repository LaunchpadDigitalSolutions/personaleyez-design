<!DOCTYPE html>

<head>

<link rel="icon" href="img/icon-180.png?v=0.9.0">
<link rel="apple-touch-icon" href="img/icon-180.png?v=0.9.0">
<link rel="preconnect" href="https://fonts.googleapis.com">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Peach State">
<meta property="og:title" content="{{TITLE}} — Peach State, Hartlepool">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="https://peachstate.co.uk/{{FILE}}">
<meta property="og:image" content="https://peachstate.co.uk/img/logo.png">
<meta name="twitter:card" content="summary_large_image">

</head>
<body data-page="{{KEY}}">
<header class="site-header" id="site-header"></header>

<section class="sec-sm">
  <div class="wrap">
    <span class="label" data-edit="page_label">{{TITLE}}</span>
    <h1 class="display-lg" style="margin-top:22px"><span data-edit="hero_line1">{{H1A}} </span><span class="italic tera" data-edit="hero_line2">{{H1B}}</span></h1>
    <p class="body-lg" style="margin-top:26px" data-edit="intro_body">{{INTRO}}</p>
{{CLUB}}  </div>
</section>

<section class="cp-bandsec">
<ul class="cp-band">
  <li style="display:contents"><figure><img loading="lazy" data-img="tile1" src="" alt=""><figcaption data-edit="tile1_cap">{{T1}}</figcaption></figure></li>
  <li style="display:contents"><figure><img loading="lazy" data-img="tile2" src="" alt=""><figcaption data-edit="tile2_cap">{{T2}}</figcaption></figure></li>
  <li style="display:contents"><figure><img loading="lazy" data-img="tile3" src="" alt=""><figcaption data-edit="tile3_cap">{{T3}}</figcaption></figure></li>
{{TILE4}}</ul>
</section>

<section class="sec cp-root" id="range">
  <div class="wrap"><span class="label" data-edit="range_label">The range</span></div>
  <div id="cp-grid" data-no-edit style="margin-top:22px"></div>
  <div id="cp-basket" data-no-edit hidden></div>
</section>

<section class="sec band-cream cp-contact" id="contact">
  <div class="wrap"><div class="cp-cols">
    <div>
      <span class="label" data-edit="contact_label">Contact</span>
      <h2 class="display-md" style="margin-top:18px" data-edit="contact_title">Not quite what you need?</h2>
      <p class="body" style="margin-top:20px" data-edit="contact_body">Tell us what you're after and we'll come back with a price. If it's urgent, ringing is quickest.</p>
      <a class="btn-solid" href="contact.html?cat={{CONTACT}}"><span data-edit="contact_cta">Enquire about {{ENQ}}</span></a>
    </div>
    <ul class="dl">
      <li><b>Phone</b><span><a href="#" data-brand-href="phoneLink" data-brand="phone"></a></span></li>
      <li><b>Find us</b><span><span data-brand="address1"></span>, <span data-brand="postcode"></span></span></li>
      <li><b>Opening hours</b><ul class="hours" id="hours"></ul></li>
    </ul>
  </div></div>
</section>

<nav class="mobilebar">
  <a href="#" data-brand-href="phoneLink">Call</a>
  <a href="contact.html?cat={{CONTACT}}" class="accent">Enquire</a>
</nav>

<footer class="site-footer" id="site-footer"></footer>
<script src="js/config.js?v=0.9.0"></script>
<script src="js/api.js?v=0.9.3"></script>
<script src="js/partials.js?v=0.9.1"></script>
<script src="js/inline-edit.js?v=0.9.3"></script>
<script>document.addEventListener("DOMContentLoaded",async()=>{await loadContent("{{KEY}}");applyContent();psInitInlineEditor("{{KEY}}");});</script>
<script type="module" src="js/category-page-boot.js?v=0.1.0"></script>
</body>
</html>
