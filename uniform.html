<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B2622">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/img/icon-180.png?v=0.9.0">
<link rel="stylesheet" href="/css/style.css?v=0.9.0">
<title>School Uniform &mdash; Peach State</title>
<style>
.uniform-hero{padding:48px 20px 32px;text-align:center}
.uniform-hero .label{margin-bottom:10px}
.uniform-hero h1{font-family:var(--display);font-size:clamp(28px,6vw,46px);font-weight:400;margin:0 0 8px}
.uniform-hero p{color:var(--muted);font-size:15px;max-width:480px;margin:0 auto 0}
.items-wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
.items-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:580px){.items-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.items-grid{grid-template-columns:repeat(4,1fr)}}
.item-card{background:#fff;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.item-img{aspect-ratio:1;background:var(--cream-deep);overflow:hidden}
.item-img img{width:100%;height:100%;object-fit:cover;display:block}
.item-body{padding:12px}
.item-name{font-weight:600;font-size:14px;line-height:1.3;margin-bottom:4px}
.item-price{font-family:var(--display);font-size:15px;color:var(--terracotta)}
.item-sizes{font-size:12px;color:var(--muted);margin-top:4px}
.item-colours{font-size:12px;color:var(--muted);margin-top:2px}
.uniform-cta{text-align:center;padding:16px 20px 48px}
.uniform-cta p{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state h2{font-family:var(--display);font-size:22px;font-weight:400;margin-bottom:10px}
</style>
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="health" id="health" style="display:none">Can&rsquo;t reach the shop system.</div>

<section id="page-content">
  <div class="uniform-hero">
    <div class="label">School uniform</div>
    <h1 id="school-name">Loading&hellip;</h1>
    <p id="school-phase"></p>
  </div>
  <div class="items-wrap">
    <div class="items-grid" id="items-grid">
      <div class="item-card"><div class="item-img"></div><div class="item-body"><div style="height:14px;background:var(--cream-deep);border-radius:2px;margin-bottom:6px"></div><div style="height:12px;width:60%;background:var(--cream-deep);border-radius:2px"></div></div></div>
      <div class="item-card"><div class="item-img"></div><div class="item-body"><div style="height:14px;background:var(--cream-deep);border-radius:2px;margin-bottom:6px"></div><div style="height:12px;width:60%;background:var(--cream-deep);border-radius:2px"></div></div></div>
      <div class="item-card"><div class="item-img"></div><div class="item-body"><div style="height:14px;background:var(--cream-deep);border-radius:2px;margin-bottom:6px"></div><div style="height:12px;width:60%;background:var(--cream-deep);border-radius:2px"></div></div></div>
      <div class="item-card"><div class="item-img"></div><div class="item-body"><div style="height:14px;background:var(--cream-deep);border-radius:2px;margin-bottom:6px"></div><div style="height:12px;width:60%;background:var(--cream-deep);border-radius:2px"></div></div></div>
    </div>
  </div>
  <div class="uniform-cta" id="cta" style="display:none">
    <p>Ready to order? Visit our school shop to place your uniform order.</p>
    <a href="/schools-shop.html" class="btn-solid"
       style="display:inline-block;text-decoration:none;padding:0 28px;line-height:52px"
       >Order school uniform</a>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="/js/config.js?v=0.9.0"></script>
<script src="/js/api.js?v=0.9.0"></script>
<script src="/js/partials.js?v=0.9.0"></script>
<script>
(async function () {
  /* ---- read slug from URL path (/uniform/SLUG) ---- */
  const parts = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  const slug = parts[parts.length - 1] || '';
  if (!slug || slug === 'uniform') { location.href = '/schools-shop.html'; return; }

  const SB  = 'https://coiwwbroycaznkmhevde.supabase.co';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvaXd3YnJveWNhem5rbWhldmRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NzIwMjksImV4cCI6MjA5OTU0ODAyOX0.r-k8RjKqouqjekvEXSMKzJykKbtgpGLMZQXcXhAmRW8';

  /* ---- escape helpers ---- */
  function he(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ---- parallel fetch: school info + assigned items ---- */
  let school = null, items = [];
  try {
    const [schRes, itemRes] = await Promise.all([
      fetch(`${SB}/rest/v1/ps_schools?slug=eq.${encodeURIComponent(slug)}&select=name,phase&limit=1`, {
        headers: { apikey: KEY, Authorization: `Bearer ${KEY}` }
      }),
      fetch(`/api/uniform-items?slug=${encodeURIComponent(slug)}`)
    ]);
    if (schRes.ok) {
      const d = await schRes.json();
      school = Array.isArray(d) && d.length ? d[0] : null;
    }
    if (itemRes.ok) {
      const d = await itemRes.json();
      items = Array.isArray(d.items) ? d.items : [];
    }
  } catch (e) {
    document.getElementById('health').style.display = '';
  }

  /* ---- populate school heading ---- */
  const nameEl  = document.getElementById('school-name');
  const phaseEl = document.getElementById('school-phase');
  if (school) {
    nameEl.textContent  = school.name;
    document.title      = school.name + ' Uniform — Peach State';
    if (school.phase) phaseEl.textContent = school.phase;
  } else {
    nameEl.textContent = slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  /* ---- render items ---- */
  const grid = document.getElementById('items-grid');
  const cta  = document.getElementById('cta');

  if (!items.length) {
    grid.closest('.items-wrap').innerHTML =
      `<div class="empty-state">
        <h2>Uniform items coming soon</h2>
        <p>We're setting up this school's uniform shop &mdash; check back shortly.</p>
      </div>`;
    return;
  }

  grid.innerHTML = items.map(it => `
    <div class="item-card">
      <div class="item-img">${it.image_url
        ? `<img src="${he(it.image_url)}" alt="${he(it.name)}" loading="lazy">`
        : ''}</div>
      <div class="item-body">
        <div class="item-name">${he(it.name)}</div>
        ${it.price != null ? `<div class="item-price">&pound;${Number(it.price).toFixed(2)}</div>` : ''}
        ${it.sizes ? `<div class="item-sizes">${he(it.sizes)}</div>` : ''}
        ${it.colours ? `<div class="item-colours">${he(it.colours)}</div>` : ''}
      </div>
    </div>`).join('');

  cta.style.display = '';
})();
</script>
</body>
</html>
