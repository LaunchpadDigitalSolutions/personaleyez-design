<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EE">
<link rel="icon" href="img/icon-180.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=0.3.0">
<title>Track Your Order — Peach State</title>
<meta name="description" content="Check where your Peach State order is up to.">
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="health" id="health">We can't reach the order system just now — please give us a ring.</div>

<section class="sec">
  <div class="wrap-narrow">
    <span class="label">Order tracking</span>
    <h1 class="display-lg" style="margin-top:20px">Where's my <span class="italic tera">order?</span></h1>
    <p class="body" style="margin-top:24px">Pop in the reference we gave you when you ordered. It looks like <strong style="font-family:var(--display);letter-spacing:.02em">PD-4K7QP</strong>.</p>

    <div class="fld" style="margin-top:40px">
      <label for="ref">Order reference</label>
      <input id="ref" type="text" placeholder="PD-XXXXX" maxlength="9" autocomplete="off"
             style="text-transform:uppercase;font-family:var(--display);font-size:26px"
             onkeydown="if(event.key==='Enter')lookup()">
    </div>
    <button class="btn-solid" id="lookup-btn" onclick="lookup()" style="margin-top:28px">Check my order</button>
    <div class="notice" id="notice"></div>

    <div id="result" style="display:none">
      <div class="trackbox">
        <div class="track-ref" id="r-ref"></div>
        <div class="track-desc" id="r-desc"></div>
        <span class="stat-word" id="r-pill"></span>
        <ul class="timeline" id="r-timeline"></ul>
      </div>
      <p class="body" style="margin-top:28px">Something not right? Ring us on
        <a href="#" data-brand-href="phoneLink" style="color:var(--terracotta)" data-brand="phone"></a>.</p>
    </div>

    <p class="body dim" style="margin-top:56px;font-size:15px">
      No reference? No bother — ring the studio and we'll look it up for you.</p>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="js/config.js?v=0.3.0"></script>
<script src="js/api.js?v=0.3.0"></script>
<script src="js/partials.js?v=0.3.0"></script>
<script src="js/track.js?v=0.3.0"></script>
</body>
</html>
