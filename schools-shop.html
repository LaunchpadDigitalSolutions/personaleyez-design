<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EE">
<link rel="icon" href="img/icon-180.png?v=0.7.6">
<link rel="apple-touch-icon" href="img/icon-180.png?v=0.7.6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=0.7.6">
<title>Order school uniform — Peach State</title>
<meta name="description" content="Pick your school, choose your uniform, and order online — embroidered logo included, initials on request.">
</head>
<body>
<header class="site-header" id="site-header"></header>
<div class="health" id="health">We can't reach the shop just now — please give us a ring.</div>

<section class="sec" id="su">
  <div class="wrap">
    <span class="label">School uniform</span>
    <h1 class="display-lg" style="margin-top:18px">Pick your school<span class="italic tera">.</span></h1>
    <p class="body" style="margin-top:22px">Choose your school below, then the pieces you need. Some pieces can have the school crest embroidered on, with initials added too — you'll see the option on anything that qualifies.</p>
  </div>

  <div class="wrap" style="margin-top:40px">
    <div id="su-phases" class="su-tabs"></div>

    <div id="su-schools-wrap" style="display:none;margin-top:32px">
      <div id="su-tabs" class="su-tabs"></div>

      <div class="su-split">
        <div class="su-controls">
          <div id="su-list" class="su-list"></div>
          <div id="su-picker" class="su-picker" style="display:none;margin-top:24px"></div>
        </div>
        <div id="su-preview" class="su-preview"></div>
      </div>
    </div>
  </div>
</section>

<div id="su-sticky" class="su-sticky" style="display:none">
  <button onclick="goToUniformCheckout()">
    <span id="su-sticky-count"></span>
    <span id="su-sticky-total"></span>
    <span class="su-sticky-arrow">View order &rarr;</span>
  </button>
</div>

<nav class="mobilebar">
  <a href="#" data-brand-href="phoneLink">Call</a>
  <a href="contact.html" class="accent">Enquire</a>
</nav>

<footer class="site-footer" id="site-footer"></footer>
<script src="js/config.js?v=0.7.6"></script>
<script src="js/api.js?v=0.7.6"></script>
<script src="js/partials.js?v=0.7.6"></script>
<script src="js/schools-shop.js?v=0.7.6"></script>
</body>
</html>
