<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2622">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="img/icon-180.png?v=0.6.9">
<link rel="stylesheet" href="css/style.css?v=0.6.9">
<title>Orders — Peach State</title>
<style>
body{background:var(--cream-deep)}
.adminbar{background:var(--charcoal);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px}
.adminbar .wrap{display:flex;align-items:center;gap:16px;padding:0}
.adminbar h1{font-size:18px;flex:1;color:#fff}
.adminbar small{display:block;font-size:12px;color:rgba(255,255,255,.55);font-weight:400;font-family:var(--sans)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;color:#fff}
.iconbtn svg{width:20px;height:20px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tab{flex:0 0 auto;padding:0 18px;white-space:nowrap;min-height:52px;font-size:14px;font-weight:600;color:var(--text-muted);border-bottom:3px solid transparent}
.tab.on{color:var(--terracotta);border-bottom-color:var(--terracotta)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 20px 4px;max-width:1200px;margin:0 auto}
.stat{background:#fff;border:1px solid var(--line);border-radius:2px;padding:16px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--text-muted);font-weight:600}
.list{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
.orow{background:#fff;border:1px solid var(--line);border-radius:2px;
  padding:16px;margin-bottom:12px}
.orow-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.oref{font-family:var(--display);font-weight:700;font-size:16px}
.otime{margin-left:auto;font-size:12.5px;color:var(--text-muted)}
.ocust{font-weight:600;margin-top:8px}
.odesc{color:var(--text-muted);font-size:14.5px;margin-top:2px}
.ometa{font-size:13px;color:var(--text-muted);margin-top:8px}
.oact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.oact button{flex:1;min-width:130px;min-height:44px;border-radius:2px;
  font-weight:600;font-size:14px;background:var(--terracotta);color:#fff}
.oact .ghost{background:var(--cream-deep);color:var(--text)}
.newcard{background:#fff;border:1px solid var(--line);border-radius:2px;
  padding:20px;max-width:640px;margin:0 auto}
@media(min-width:768px){.stats{grid-template-columns:repeat(4,1fr)}}

/* ---- demo PIN gate ---- */
.pingate{position:fixed;inset:0;z-index:500;background:var(--cream);
  display:flex;align-items:center;justify-content:center;padding:24px}
.pingate.hidden{display:none}
.pinbox{width:100%;max-width:340px;text-align:center}
.pinlogo{height:130px;width:auto;margin:0 auto 28px}
.pinbox h1{font-family:var(--display);font-size:27px;margin:0 0 6px;font-weight:400}
.pinbox p{color:var(--muted);font-size:15px;margin:0 0 28px}
.pinbox input{text-align:center;font-family:var(--display);font-size:32px;
  letter-spacing:.32em;border-bottom:1px solid var(--line);padding:12px 0}
.pinbox .btn-solid{margin-top:26px}
.pinerr{display:none;color:#9B3B1E;font-size:14px;margin-top:14px}
.pinerr.show{display:block}
</style>
</head>
<body>
<!-- ============================================================
     DEMO PIN GATE — cosmetic only, see js/config.js
     ============================================================ -->
<div class="pingate" id="pingate">
  <div class="pinbox">
    <img src="img/logo.png?v=0.6.9" alt="Peach State" class="pinlogo">
    <h1>Order management</h1>
    <p>Enter your PIN to continue.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off"
           maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')tryPin()">
    <div class="pinerr" id="pinerr">That's not right — try again.</div>
    <button class="btn-solid" onclick="tryPin()">Unlock</button>
  </div>
</div>
<div class="adminbar"><div class="wrap">
  <div style="flex:1"><h1 data-brand="name" style="font-family:var(--display)"></h1><small>Order management</small></div>
  <button class="iconbtn" onclick="lockAdmin()" aria-label="Lock" style="margin-right:8px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  <button class="iconbtn" onclick="load()" aria-label="Refresh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
</div></div>
<div class="health" id="health">Can't reach the order system.</div>

<div class="tabs">
  <button class="tab on" data-tab="live" onclick="setTab('live')">Live</button>
  <button class="tab" data-tab="all" onclick="setTab('all')">All orders</button>
  <button class="tab" data-tab="enq" onclick="setTab('enq')">Enquiries</button>
  <button class="tab" data-tab="new" onclick="setTab('new')">New order</button>
  <button class="tab" data-tab="groups" onclick="setTab('groups')">Club shops</button>
  <button class="tab" data-tab="shop" onclick="setTab('shop')">Shop</button>
  <button class="tab" data-tab="products" onclick="setTab('products')">Products</button>
  <button class="tab" data-tab="content" onclick="setTab('content')">Wording</button>
</div>

<div class="stats" id="stats"></div>
<div class="list" id="panel"></div>
<div class="toast" id="toast"></div>
<script src="js/config.js?v=0.6.9"></script>
<script src="js/api.js?v=0.6.9"></script>
<script src="js/partials.js?v=0.6.9"></script>
<script src="js/admin.js?v=0.6.9"></script>
<script src="js/admin-shop.js?v=0.6.9"></script>
<script src="js/admin-square.js?v=0.6.9"></script>
</body>
</html>
