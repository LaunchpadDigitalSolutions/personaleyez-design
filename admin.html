<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Orders | Personaleyez Design</title>
<style>
body{background:var(--surface)}
.adminbar{background:var(--primary);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px}
.adminbar .wrap{display:flex;align-items:center;gap:16px;padding:0}
.adminbar h1{font-size:18px;flex:1;color:#fff}
.adminbar small{display:block;font-size:12px;color:rgba(255,255,255,.55);font-weight:400;font-family:var(--font-body)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;color:#fff}
.iconbtn svg{width:20px;height:20px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.tab{flex:1;min-height:52px;font-size:14px;font-weight:600;color:var(--text-muted);border-bottom:3px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 20px 4px;max-width:1200px;margin:0 auto}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.stat b{display:block;font-family:var(--font-heading);font-size:26px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--text-muted);font-weight:600}
.list{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
.orow{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;margin-bottom:12px}
.orow-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.oref{font-family:var(--font-heading);font-weight:700;font-size:16px}
.otime{margin-left:auto;font-size:12.5px;color:var(--text-muted)}
.ocust{font-weight:600;margin-top:8px}
.odesc{color:var(--text-muted);font-size:14.5px;margin-top:2px}
.ometa{font-size:13px;color:var(--text-muted);margin-top:8px}
.oact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.oact button{flex:1;min-width:130px;min-height:44px;border-radius:var(--radius-md);
  font-weight:600;font-size:14px;background:var(--accent);color:#fff}
.oact .sec{background:var(--surface-2);color:var(--text)}
.newcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px;max-width:640px;margin:0 auto}
@media(min-width:768px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="adminbar"><div class="wrap">
  <div style="flex:1"><h1 data-brand="name"></h1><small>Order management</small></div>
  <button class="iconbtn" onclick="load()" aria-label="Refresh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
</div></div>
<div class="health" id="health">Can't reach the order system.</div>

<div class="tabs">
  <button class="tab on" data-tab="live" onclick="setTab('live')">Live</button>
  <button class="tab" data-tab="all" onclick="setTab('all')">All orders</button>
  <button class="tab" data-tab="enq" onclick="setTab('enq')">Enquiries</button>
  <button class="tab" data-tab="new" onclick="setTab('new')">New order</button>
</div>

<div class="stats" id="stats"></div>
<div class="list" id="panel"></div>
<div class="toast" id="toast"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/partials.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
