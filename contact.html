<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EE">
<link rel="icon" href="img/icon-180.png?v=0.5.8">
<link rel="apple-touch-icon" href="img/icon-180.png?v=0.5.8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=0.5.8">
<title>Contact — Peach State, Hartlepool</title>
<meta name="description" content="Get a quote for embroidery, print, school uniform or workwear. 184 York Road, Hartlepool. 01429 866266.">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="sec">
  <div class="wrap">
    <div class="pair form-first">
      <div class="col-type">
        <span class="label">Get in touch</span>
        <h1 class="display-lg" style="margin-top:20px">Tell us what<br>you're <span class="italic tera">after.</span></h1>
        <p class="body" style="margin-top:26px">A rough idea is plenty. We'll come back with a price and any questions. If it's urgent, ringing is quickest.</p>
        <ul class="dl">
          <li><b>Phone</b><span><a href="#" data-brand-href="phoneLink" data-brand="phone"></a></span></li>
          <li><b>Find us</b><span><span data-brand="address1"></span>, <span data-brand="postcode"></span></span></li>
          <li><b>Opening hours</b><ul class="hours" id="hours"></ul></li>
        </ul>
      </div>
      <div>
        <div class="fld"><label for="c-name">Your name</label><input id="c-name" type="text" autocomplete="name"></div>
        <div class="fld"><label for="c-phone">Phone</label><input id="c-phone" type="tel" autocomplete="tel"></div>
        <div class="fld"><label for="c-email">Email (optional)</label><input id="c-email" type="email" autocomplete="email"></div>
        <div class="fld"><label for="c-cat">What's it for</label>
          <select id="c-cat">
            <option value="school">School uniform</option>
            <option value="workwear">Workwear or team kit</option>
            <option value="personalised">Personalised gift</option>
            <option value="other">Something else</option>
          </select></div>
        <div class="fld"><label for="c-msg">What do you need?</label>
          <textarea id="c-msg" placeholder="e.g. 12 navy polos, logo on the left breast, needed end of the month"></textarea></div>
        <div class="notice" id="c-notice"></div>
        <button class="btn-solid" id="c-send" onclick="submitEnquiry()" style="margin-top:32px">Send enquiry</button>
        <p class="body dim" style="font-size:13.5px;margin-top:18px">We'll only use your details to reply to this enquiry.</p>
      </div>
    </div>
  </div>
</section>

<div class="fullbleed" style="aspect-ratio:21/9"><img loading="lazy" data-img="flowers" src="" alt=""></div>

<nav class="mobilebar">
  <a href="#" data-brand-href="phoneLink">Call</a>
  <a href="contact.html" class="accent">Enquire</a>
</nav>

<footer class="site-footer" id="site-footer"></footer>
<script src="js/config.js?v=0.5.8"></script>
<script src="js/api.js?v=0.5.8"></script>
<script src="js/partials.js?v=0.5.8"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("hours").innerHTML =
    BRAND.hours.map(([d,t])=>`<li><span>${d}</span><span>${t}</span></li>`).join("");
});
function cSay(c,m){const n=document.getElementById("c-notice");n.className="notice show "+c;n.textContent=m;}
async function submitEnquiry(){
  const v=id=>document.getElementById(id).value.trim();
  const btn=document.getElementById("c-send");
  if(!v("c-name")){cSay("err","We need your name.");return;}
  if(!v("c-phone")&&!v("c-email")){cSay("err","Leave a phone number or email so we can reply.");return;}
  if(!v("c-msg")){cSay("err","Tell us a bit about what you need.");return;}
  btn.disabled=true;cSay("busy","Sending…");
  try{
    await sendEnquiry({name:v("c-name"),phone:v("c-phone"),email:v("c-email")||null,
      category:v("c-cat"),message:v("c-msg")});
    cSay("ok","Thanks — that's come through. We'll be in touch shortly.");
    ["c-name","c-phone","c-email","c-msg"].forEach(i=>document.getElementById(i).value="");
  }catch(e){ cSay("err","That didn't send. Please ring us on "+BRAND.phone+"."); }
  btn.disabled=false;
}
</script>
</body>
</html>
